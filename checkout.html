<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>

    <link rel="stylesheet" href="stylesheets/general.css" />
    <link rel="stylesheet" href="stylesheets/header.css" />
    <link rel="stylesheet" href="stylesheets/checkout.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="checkout-header">
      <a href="/" class="header-left">
        <img
          src="images/logo/amazon-logo.png"
          alt="Amazon Logo"
          class="amazon-logo"
        />
        <img
          src="images/logo/amazon-mobile-logo-white.png"
          alt="Amazon Logo"
          class="amazon-mobile-logo"
        />
      </a>

      <div class="header-middle">
        Checkout (<span class="cart-item"
          ><span class="js-cart-quantity"></span> items</span
        >)
      </div>

      <div class="header-right">
        <img
          src="images/icons/checkout-lock-icon.png"
          alt="Lock Icon"
          class="lock-icon"
        />
      </div>
    </header>

    <main>
      <div class="page-title">Review your order</div>

      <div class="checkout-grid">
        <div class="order-details-list js-cart-list"></div>

        <div class="order-summary-card js-payment-summary"></div>
      </div>
    </main>

    <script type="module" src="scripts/checkout.js"></script>
  </body>
</html>
