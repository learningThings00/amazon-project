<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders</title>

    <link rel="stylesheet" href="stylesheets/general.css" />
    <link rel="stylesheet" href="stylesheets/header.css" />
    <link rel="stylesheet" href="stylesheets/orders.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="amazon-header">
      <div class="header-left">
        <a href="/">
          <img
            src="images/logo/amazon-logo-white.png"
            alt="Amazon Logo"
            class="amazon-logo"
          />
          <img
            src="images/logo/amazon-mobile-logo-white.png"
            alt="Amazon Logo"
            class="amazon-mobile-logo"
          />
        </a>
      </div>

      <div class="header-middle">
        <input
          type="search"
          name="search"
          id="search"
          class="search-bar js-search-bar"
          placeholder="Search"
        />
        <button class="search-button">
          <img
            src="images/icons/search-icon.png"
            alt="
          Search Icon"
            class="search-icon js-search-button"
          />
        </button>
      </div>

      <div class="header-right">
        <a class="order-section" href="orders.html">
          <span class="return-text">Return</span>
          <span class="order-text">& Orders</span>
        </a>
        <a href="checkout.html" class="cart-container">
          <img
            src="images/icons/cart-icon.png"
            alt="Cart Icon"
            class="cart-icon"
          /><span class="cart-text">Cart</span>
          <span class="cart-quantity js-cart-quantity"></span>
        </a>
      </div>
    </header>

    <main>
      <div class="page-title">Your Orders</div>

      <div class="js-order-list"></div>
    </main>

    <script src="scripts/orders.js" type="module"></script>
  </body>
</html>
