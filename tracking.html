<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracking</title>

    <link rel="stylesheet" href="stylesheets/general.css" />
    <link rel="stylesheet" href="stylesheets/header.css" />
    <link rel="stylesheet" href="stylesheets/tracking.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="amazon-header">
      <div class="header-left">
        <img
          src="images/logo/amazon-logo-white.png"
          alt="Amazon Logo"
          class="amazon-logo"
        />
        <img
          src="images/logo/amazon-mobile-logo-white.png"
          alt="Amazon Logo"
          class="amazon-mobile-logo"
        />
      </div>

      <div class="header-middle">
        <input
          type="search"
          name="search"
          id="search"
          class="search-bar"
          placeholder="Search"
        />
        <button class="search-button">
          <img
            src="images/icons/search-icon.png"
            alt="
          Search Icon"
            class="search-icon"
          />
        </button>
      </div>

      <div class="header-right">
        <a class="order-section" href="orders.html">
          <span class="return-text">Return</span>
          <span class="order-text">& Orders</span>
        </a>
        <a href="checkout.html" class="cart-container">
          <img
            src="images/icons/cart-icon.png"
            alt="Cart Icon"
            class="cart-icon"
          /><span class="cart-text">Cart</span>
          <span class="cart-quantity js-cart-quantity"></span>
        </a>
      </div>
    </header>

    <main>
      <a class="back-to-orders" href="orders.html">View all orders</a>

      <div class="page-title">Arriving on Friday, September 14</div>
      <div class="product-name">2 slot Toaster</div>
      <div class="quantity-row">Quantity: <span>1</span></div>
      <img
        src="images/products/2-slot-toaster-white.jpg"
        class="product-image"
      />
      <div class="progress-label-container">
        <div class="preparing">Preparing</div>
        <div class="shipped">Shipped</div>
        <div class="delivered">Delivered</div>
      </div>
      <div class="progress-bar-container"></div>
    </main>
  </body>
</html>
